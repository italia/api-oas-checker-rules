#
# Naming convention hints
#
# $..parameters.[?(@.name && @.name.match("^(nome|cognome|name|surname|cf|fiscalcode)$",i))]
rules:
  use-recommended-names-in-parameters: &use-recommended-names
    description: |-
      Use well defined parameter and schema names, deriving them
      from the national ontologies available at https://w3id.org/italia/onto/

      For example, you can model a person using the following names:
      
      ```
      {
        "en": {
          "given_name": "Mario",
          "family_name": "Rossi",
          "tax_code": "12345678901"
        },
        "it": {
          "nome_proprio": "Mario",
          "cognome": "Rossi",
          "codice_fiscale": "12345678901"
        }
      }
      ```


    message: |-
      The parameter name '{{value}}' should align with national ontologies. Use standardized names like 'given_name', 'family_name', 'tax_code'.
    formats:
      - oas3
    severity: info
    given: >-
      $..parameters.[?(@ && @.name && @.name.match && @.name.match(/^(nome|name|surname|cf|fiscal_?code|fiscal_?number|first_?name|last_?name)$/i) )].name
    then:
      function: pattern
      functionOptions:
        match: //
  use-recommended-names-in-schemas:
    description: |-
      Use well defined parameter and schema names, deriving them
      from the national ontologies available at https://w3id.org/italia/onto/
    message: "The property name '{{value}}' should align with national ontologies. Use standardized names like 'given_name', 'family_name', 'tax_code'."
    formats:
      - oas3
    severity: info
    given: '$..[?(@ && @.type=="object")].properties.[?(
       @property 
       && @property.match 
       && @property.match(/^(nome|name|surname|cf|fiscal_?code|fiscal_?number|first_?name|last_?name)$/i)
      )]'
    then:
      field: "@property"
      function: undefined
  no-method-name-in-operationId:
    description: |-
      Avoid using method names in `operationId`s because it couples
      the API design with the implementation.

      An operation that edits an entry can be published with different methods,
      for example either POST, PUT or PATCH, and while evolving the API
      you could decide to associate an operationId with another method.

      You can use for example

      ```
      openapi: 3.0.1
      ...
      paths:
        /entries:
          get:
            operationId: list_entries
          post:
            operationId: create_entry
        /entries/{id}:
          put:
            operationId: upsert_entry
          patch:
            operationId: edit_entry
      ```
      
    message: |-
      The operationId '{{value}}' starts with an HTTP verb (get, post, put, delete, patch). Use a resource-centric name instead.
    formats:
      - oas3
    severity: hint
    given: >-
      $..[?(@ && @.operationId && @.operationId.match && @.operationId.match(/^(get|post|put|delete|patch|head)/i) )].operationId
    then:
      function: pattern
      functionOptions:
        match: //

  property-names-ascii:
      description: |-
        Schema property names MUST contain only ASCII characters.

        Property names are used by tools to generate classes and variables:
        non-ASCII characters break code generators and integrations,
        may lead to vulnerable code and force implementers to write
        complex integration tests.

        See Italian recommendation RAC_GEN_NAME_002.
      message: '[RAC_GEN_NAME_002] Property name "{{property}}" must contain only ASCII characters.'
      severity: error
      recommended: true
      resolved: false
      formats:
        - oas3
      given: $..properties
      then:
        field: "@key"
        function: pattern
        functionOptions:
          notMatch: "[^\\x00-\\x7F]"

  schema-names-ascii:
    description: |-
      Schema names MUST contain only ASCII characters.

      Schema names are used by tools to generate class names.

      See Italian recommendation RAC_GEN_NAME_003 (self-descriptive names
      for services, paths, operations and schemas).
    message: '[RAC_GEN_NAME_003] Schema name "{{property}}" must contain only ASCII characters.'
    severity: error
    recommended: true
    resolved: false
    formats:
      - oas3
    given: $.components.schemas
    then:
      field: "@key"
      function: pattern
      functionOptions:
        notMatch: "[^\\x00-\\x7F]"

  parameter-names-ascii:
    description: |-
      Parameter names MUST contain only ASCII characters.

      Parameter names are used as keys by clients and servers.
      Header parameters are checked by the header rules.

      See Italian recommendation RAC_GEN_NAME_002, applied to parameter
      names as they are keys used by applications.
    message: '[RAC_GEN_NAME_002] Parameter name "{{value}}" must contain only ASCII characters.'
    severity: error
    recommended: true
    resolved: false
    formats:
      - oas3
    given:
      - "$..parameters[?(@ && @.in != 'header')].name"
    then:
      function: pattern
      functionOptions:
        notMatch: "[^\\x00-\\x7F]"


  operation-id-ascii:
    description: |-
      operationId values MUST contain only ASCII characters.

      Code generators use the operationId as the method name
      in the generated clients and servers.

      See Italian recommendation RAC_GEN_NAME_002.
    message: '[RAC_GEN_NAME_002] operationId "{{value}}" must contain only ASCII characters.'
    severity: error
    recommended: true
    resolved: false
    formats:
      - oas3
    given: $.paths[*][get,put,post,delete,options,head,patch,trace].operationId
    then:
      function: pattern
      functionOptions:
        notMatch: "[^\\x00-\\x7F]"