rules:
  no-forbidden-headers:
    description: |-
      OAS do not allow using the following HTTP headers in a specification
      file: Authorization, Content-Type and Accept.
      You MUST use the associate functionalities provided by OAS, instead.
    message: "Do not define 'Authorization', 'Content-Type' or 'Accept' as headers; use the specific OAS fields for security schemes or media types instead."
    severity: error
    given:
      - "$..parameters[?(@ && @.in == 'header')].name"
      - $..[responses][*].headers.*~
    then:
      function: pattern
      functionOptions:
        notMatch: >-
          /^(accept|content-type|authorization)$/i

  no-x-headers-request: &no-x-headers
    description: |-
      'HTTP' headers SHOULD NOT start with 'X-' RFC6648.
    severity: warn
    given:
      - "$..parameters[?(@ && @.in == 'header')].name"
    message: "[RFC6648] Avoid using 'X-' prefix for header '{{value}}'. Use meaningful names instead."
    recommended: true
    type: style
    then:
      function: pattern
      functionOptions:
        # De Morgan:  !~ /^x-/ <=> h[0] != 'x' || h[1] != '-'
        match: >-
          /^([^x]|.[^-])|RateLimit-|Correlation-ID|ReplyTo/i
  no-x-headers-response:
    <<: *no-x-headers
    given:
      - $..[responses][*].headers.*~
    message: "[RFC6648] Avoid using 'X-' prefix for response header '{{property}}'. Use a meaningful name instead."
    then:
      function: pattern
      functionOptions:
        match: >-
          /^([^x]|.[^-])|RateLimit-|Correlation-ID|ReplyTo/i


  request-headers-token:
    description: |-
      HTTP header names MUST be valid tokens.

      According to RFC9110 section 5.1, a field name is a token:
      only ASCII letters, digits and the characters !#$%&'*+-.^_`|~
      are allowed. Spaces and non-ASCII characters are not allowed.
    message: '[RFC9110] Header name "{{value}}" must be a valid token (ASCII letters, digits and !#$%&''*+-.^_`|~).'
    severity: error
    recommended: true
    resolved: false
    given:
      - "$..parameters[?(@ && @.in == 'header')].name"
    then:
      function: pattern
      functionOptions:
        match: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"


  response-headers-token:
    description: |-
      HTTP response header names MUST be valid tokens.

      According to RFC9110 section 5.1, a field name is a token:
      only ASCII letters, digits and the characters !#$%&'*+-.^_`|~
      are allowed. Spaces and non-ASCII characters are not allowed.
    message: '[RFC9110] Response header name "{{property}}" must be a valid token (ASCII letters, digits and !#$%&''*+-.^_`|~).'
    severity: error
    recommended: true
    resolved: false
    given:
      - $..[responses][*].headers.*~
    then:
      function: pattern
      functionOptions:
        match: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
